name: Bug Report
description: Create a report to help us improve ActionLens
title: "[Bug]: "
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for filing an issue for ActionLens!
  - type: textarea
    id: description
    attributes:
      label: Bug Description
      description: A clear description of the bug.
    validations:
      required: true
  - type: textarea
    id: workflow_snippet
    attributes:
      label: Workflow YAML Snippet
      description: Provide the minimal GitHub Actions YAML snippet triggering the issue.
      render: yaml
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected Behavior
      description: What did you expect to happen?
    validations:
      required: true

